[project]
name = "token-efficiency"
version = "0.2.0"
description = "Plotting utilities for token efficiency and legibility benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.2",
    "tomli-w>=1.1.0",
    "transformers>=4.45.0",
    "tqdm>=4.66.5",
    "dictdiffer>=0.9.0",
    "rich>=14.2.0",
]

[project.scripts]
token-efficiency = "token_efficiency.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[tool.setuptools.packages.find]
include = ["token_efficiency*"]

[tool.pytest.ini_options]
addopts = "-q"
